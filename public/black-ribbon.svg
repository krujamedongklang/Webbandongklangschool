<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="70" height="84">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="50%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <!-- Loop -->
    <path d="M 50 10 C 25 10, 15 35, 30 50 C 40 60, 50 70, 50 70 C 50 70, 60 60, 70 50 C 85 35, 75 10, 50 10 Z" fill="url(#ribbonGrad)" stroke="#555" stroke-width="1"/>
    <!-- Inner hole of loop -->
    <path d="M 50 22 C 38 22, 33 35, 42 45 C 47 50, 50 55, 50 55 C 50 55, 53 50, 58 45 C 67 35, 62 22, 50 22 Z" fill="#121212" />
    <!-- Left tail -->
    <path d="M 45 62 L 15 110 L 30 105 L 48 70 Z" fill="url(#ribbonGrad)" stroke="#444" stroke-width="0.5"/>
    <!-- Right tail -->
    <path d="M 55 62 L 85 110 L 70 105 L 52 70 Z" fill="url(#ribbonGrad)" stroke="#444" stroke-width="0.5"/>
  </g>
</svg>
