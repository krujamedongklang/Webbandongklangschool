<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="85" height="106">
  <defs>
    <linearGradient id="satinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="30%" stop-color="#2a2a2a" />
      <stop offset="70%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="goldPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe17d" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#ribbonShadow)">
    <!-- Left Ribbon Tail -->
    <path d="M 52 75 L 18 138 L 38 130 L 60 84 Z" fill="url(#satinGrad)" stroke="#333" stroke-width="0.5"/>
    <path d="M 52 75 L 18 138 L 38 130 L 60 84 Z" fill="url(#highlightGrad)"/>

    <!-- Right Ribbon Tail -->
    <path d="M 68 75 L 102 138 L 82 130 L 60 84 Z" fill="url(#satinGrad)" stroke="#333" stroke-width="0.5"/>
    <path d="M 68 75 L 102 138 L 82 130 L 60 84 Z" fill="url(#highlightGrad)"/>

    <!-- Main Ribbon Loop (Outer Shell) -->
    <path d="M 60 12 C 28 12, 14 42, 34 62 C 46 74, 60 86, 60 86 C 60 86, 74 74, 86 62 C 106 42, 92 12, 60 12 Z" fill="url(#satinGrad)" stroke="#444" stroke-width="0.8"/>
    <path d="M 60 12 C 28 12, 14 42, 34 62 C 46 74, 60 86, 60 86 C 60 86, 74 74, 86 62 C 106 42, 92 12, 60 12 Z" fill="url(#highlightGrad)"/>

    <!-- Inner Loop Hollow -->
    <path d="M 60 26 C 45 26, 38 42, 48 54 C 54 60, 60 66, 60 66 C 60 66, 66 60, 72 54 C 82 42, 75 26, 60 26 Z" fill="#111111" stroke="#222" stroke-width="0.5"/>

    <!-- Gold Center Pin Accent -->
    <circle cx="60" cy="74" r="4.5" fill="url(#goldPinGrad)" stroke="#fff" stroke-width="0.5"/>
  </g>
</svg>
